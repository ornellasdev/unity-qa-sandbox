name: C# Static Analysis (No Unity License)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**/*.cs'
      - 'scripts/check_csharp.py'
      - 'scripts/check_unity_patterns.py'
      - 'scripts/test_unity_patterns.py'
      - 'scripts/build_qa_report.py'
      - '.github/workflows/csharp-static-analysis.yml'
  pull_request:
    paths:
      - 'Assets/**/*.cs'
      - 'scripts/check_csharp.py'
      - 'scripts/check_unity_patterns.py'
      - 'scripts/test_unity_patterns.py'
      - 'scripts/build_qa_report.py'
      - '.github/workflows/csharp-static-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharp-analysis:
    name: Parse C# and check code hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/csharp-static-requirements.txt

      - name: Install C# parser and Python coverage
        run: |
          python -m pip install -r scripts/csharp-static-requirements.txt
          python -m pip install coverage==7.10.7

      - name: Run analyzer regression tests with Python coverage
        shell: bash
        run: |
          mkdir -p artifacts/qa-static
          python -m coverage run --source=check_unity_patterns -m unittest discover -s scripts -p 'test_unity_patterns.py' -v 2>&1 | tee artifacts/qa-static/analyzer-tests.log

      - name: Export Python analyzer coverage
        if: always()
        run: python -m coverage xml -o artifacts/qa-static/coverage.xml

      - name: Analyze Unity C# syntax
        shell: bash
        run: python scripts/check_csharp.py 2>&1 | tee artifacts/qa-static/csharp-syntax.log

      - name: Check Unity code patterns (advisory)
        shell: bash
        run: python scripts/check_unity_patterns.py 2>&1 | tee artifacts/qa-static/unity-patterns.log

      - name: Generate static QA report
        if: always()
        run: python scripts/build_qa_report.py --folder artifacts/qa-static

      - name: Publish report in workflow summary
        if: always()
        shell: bash
        run: cat artifacts/qa-static/QA_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-qa-evidence
          path: artifacts/qa-static/
          retention-days: 30
          if-no-files-found: warn
